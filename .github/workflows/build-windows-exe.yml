name: Build Omega Horizon V8 for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build and test V8 standalone Windows EXE
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out V8 source
        uses: actions/checkout@v4

      - name: Set up 64-bit Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements-build.txt

      - name: Verify repository contains V8 campaign overhaul
        shell: pwsh
        run: |
          python -c "import omega_horizon_shmup as g; assert g.BUILD_ID == 'V8-STAGE-IDENTITY'; assert g.WEAPON_NAMES[4] == 'HOMING ROCKET'; assert len(g.STAGES) == 10; print(g.BUILD_ID)"

      - name: Source runtime regression test
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python runtime_smoke_test.py

      - name: Syntax-check the game
        shell: pwsh
        run: |
          python -m py_compile omega_horizon_shmup.py runtime_smoke_test.py

      - name: Build V8 OmegaHorizon.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean OmegaHorizon.spec
          if (-not (Test-Path "dist\OmegaHorizon.exe")) {
            throw "PyInstaller completed without creating dist\OmegaHorizon.exe"
          }

      - name: Smoke-test the PACKAGED V8 EXE
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          $p = Start-Process `
            -FilePath "$PWD\dist\OmegaHorizon.exe" `
            -ArgumentList "--smoke-test" `
            -Wait `
            -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Packaged OmegaHorizon.exe V8 smoke test failed with exit code $($p.ExitCode)"
          }
          Write-Host "PACKAGED_V8_EXE_SMOKE_TEST_OK"

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\OmegaHorizon.exe" -Algorithm SHA256).Hash
          Set-Content -Path "dist\OmegaHorizon_V8_SHA256.txt" -Value $hash -Encoding ASCII
          Write-Host "OmegaHorizon V8 SHA-256: $hash"

      - name: Create V8 release ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\OmegaHorizon.exe","dist\OmegaHorizon_V8_SHA256.txt" `
            -DestinationPath "dist\OmegaHorizon_V8_Windows_x64.zip" `
            -Force

      - name: Upload tested V8 Windows build
        uses: actions/upload-artifact@v4
        with:
          name: OmegaHorizon-Windows-x64-V8-STAGE-IDENTITY
          path: |
            dist/OmegaHorizon.exe
            dist/OmegaHorizon_V8_SHA256.txt
            dist/OmegaHorizon_V8_Windows_x64.zip
          if-no-files-found: error
          retention-days: 30
