name: Build Omega Horizon V9.1 for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build and test V9.1 authored-art foundation Windows EXE
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out V9.1 source
        uses: actions/checkout@v4

      - name: Set up 64-bit Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements-build.txt

      - name: Verify V9.1 identity and authored assets
        shell: pwsh
        run: |
          python -c "import omega_horizon_shmup as g; assert g.BUILD_ID == 'V9.1-AUTHORED-ART-FOUNDATION'; assert g.DISPLAY_VERSION == 'V9.1'; assert g.DISPLAY_SUBTITLE == 'AUTHORED ART FOUNDATION'; assert g.WEAPON_NAMES[4] == 'HOMING ROCKET'; assert len(g.PLAYER_PIXELS) >= 15; assert max(map(len,g.PLAYER_PIXELS)) >= 35; assert len(g.ICE_CLIFF_V86) >= 10; assert len(g.OMEGA_RIB_V86) >= 10; assert set(g.V91_SCENE_CHUNKS) == {'space','atmosphere','lava','water','station','hive','city','ice','veil','omega'}; assert set(g.V91_SHIELD_PIXELS) == set(g.SHIELD_ORDER); assert len(g.build_ending_lines()) > 20; assert g.SHIELD_DATA['AEGIS']['energy'] >= 60; assert g.DIFFICULTY_ORDER == ('EASY','HARDER','DIFFICULT','INSANE'); assert g.DIFFICULTY_PROFILES['INSANE']['damage'] == 1.0; print(g.BUILD_ID)"

      - name: Source regression test - authored art, sphere shields and systems
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python runtime_smoke_test.py

      - name: Syntax-check the game
        shell: pwsh
        run: |
          python -m py_compile omega_horizon_shmup.py runtime_smoke_test.py

      - name: Build V9.1 OmegaHorizon.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean OmegaHorizon.spec
          if (-not (Test-Path "dist\OmegaHorizon.exe")) {
            throw "PyInstaller completed without creating dist\OmegaHorizon.exe"
          }

      - name: Smoke-test the PACKAGED V9.1 EXE
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          LOCALAPPDATA: ${{ runner.temp }}\OmegaHorizonV91
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $p = Start-Process `
            -FilePath "$PWD\dist\OmegaHorizon.exe" `
            -ArgumentList "--smoke-test" `
            -Wait `
            -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Packaged OmegaHorizon.exe V9.1 smoke test failed with exit code $($p.ExitCode)"
          }
          Write-Host "PACKAGED_V91_EXE_SMOKE_TEST_OK"

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\OmegaHorizon.exe" -Algorithm SHA256).Hash
          Set-Content -Path "dist\OmegaHorizon_V91_SHA256.txt" -Value $hash -Encoding ASCII
          Write-Host "OmegaHorizon V9.1 SHA-256: $hash"

      - name: Create V9.1 release ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\OmegaHorizon.exe","dist\OmegaHorizon_V91_SHA256.txt" `
            -DestinationPath "dist\OmegaHorizon_V91_Windows_x64.zip" `
            -Force

      - name: Upload tested V9.1 Windows build
        uses: actions/upload-artifact@v4
        with:
          name: OmegaHorizon-Windows-x64-V9.1-AUTHORED-ART-FOUNDATION
          path: |
            dist/OmegaHorizon.exe
            dist/OmegaHorizon_V91_SHA256.txt
            dist/OmegaHorizon_V91_Windows_x64.zip
          if-no-files-found: error
          retention-days: 30
