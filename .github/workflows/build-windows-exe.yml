name: Build Omega Horizon V9.6.2 for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build and test V9.6.2 Stage 1 flagship space Windows EXE
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out V9.6.2 source
        uses: actions/checkout@v4

      - name: Set up 64-bit Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements-build.txt

      - name: Verify V9.6.2 Stage 1 flagship identity
        shell: pwsh
        run: |
          python -c "import omega_horizon_shmup as g; assert g.BUILD_ID == 'V9.6.2-STAGE1-FLAGSHIP-SPACE'; assert g.DISPLAY_VERSION == 'V9.6.2'; assert g.DISPLAY_SUBTITLE == 'STAGE 1 FLAGSHIP SPACE'; assert g.WEAPON_NAMES[4] == 'HOMING ROCKET'; assert len(g.PLAYER_PIXELS) >= 15; assert max(map(len,g.PLAYER_PIXELS)) >= 35; assert len(g.ICE_CLIFF_V86) >= 10; assert len(g.OMEGA_RIB_V86) >= 10; assert set(g.V962_SCENE_CHUNKS) == {'space','atmosphere','lava','water','station','hive','city','ice','veil','omega'}; assert set(g.V962_SHIELD_PIXELS) == set(g.SHIELD_ORDER); assert len(g.build_ending_lines()) > 20; assert g.ENDING_SCROLL_SPEED < 19; assert g.ENDING_TEXT_WIDTH <= 202; assert g.VISUAL_RECOVERY_BASELINE == 'V9.4-BACKGROUNDS/V9.1-ENEMIES'; assert g.BACKGROUND_RECOVERY_MODE and not g.AUTHORED_ENEMY_OVERRIDE; assert __import__('os').path.exists('assets/stage01_space_v962.png'); assert __import__('os').path.exists('assets/stage05_station_v961.png'); assert __import__('os').path.exists('assets/stage08_ice_v961.png'); assert __import__('os').path.exists('assets/stage09_nebula_v961.png'); assert __import__('os').path.exists('assets/title_logo_v96.png'); assert all(not __import__('os').path.exists(f'assets/enemy_stage{s:02d}_v96.png') for s in range(1,11)); assert 'boss_v93_frames' not in g.ART_ASSETS; assert g.SHIELD_DATA['AEGIS']['energy'] >= 60; assert g.DIFFICULTY_ORDER == ('EASY','HARDER','DIFFICULT','INSANE'); assert g.DIFFICULTY_PROFILES['INSANE']['damage'] == 1.0; print(g.BUILD_ID)"

      - name: Source regression test - Stage 1 flagship candidate and recovered baseline
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python runtime_smoke_test.py

      - name: Syntax-check the game
        shell: pwsh
        run: |
          python -m py_compile omega_horizon_shmup.py runtime_smoke_test.py

      - name: Build V9.6.2 OmegaHorizon.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean OmegaHorizon.spec
          if (-not (Test-Path "dist\OmegaHorizon.exe")) {
            throw "PyInstaller completed without creating dist\OmegaHorizon.exe"
          }

      - name: Smoke-test the PACKAGED V9.6.2 EXE
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          LOCALAPPDATA: ${{ runner.temp }}\OmegaHorizonV962
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $p = Start-Process `
            -FilePath "$PWD\dist\OmegaHorizon.exe" `
            -ArgumentList "--smoke-test" `
            -Wait `
            -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Packaged OmegaHorizon.exe V9.6.2 smoke test failed with exit code $($p.ExitCode)"
          }
          Write-Host "PACKAGED_V962_EXE_SMOKE_TEST_OK"

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\OmegaHorizon.exe" -Algorithm SHA256).Hash
          Set-Content -Path "dist\OmegaHorizon_V962_SHA256.txt" -Value $hash -Encoding ASCII
          Write-Host "OmegaHorizon V9.6.2 SHA-256: $hash"

      - name: Create V9.6.2 release ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\OmegaHorizon.exe","dist\OmegaHorizon_V962_SHA256.txt" `
            -DestinationPath "dist\OmegaHorizon_V962_Windows_x64.zip" `
            -Force

      - name: Upload tested V9.6.2 Windows build
        uses: actions/upload-artifact@v4
        with:
          name: OmegaHorizon-Windows-x64-V9.6.2-STAGE1-FLAGSHIP-SPACE
          path: |
            dist/OmegaHorizon.exe
            dist/OmegaHorizon_V962_SHA256.txt
            dist/OmegaHorizon_V962_Windows_x64.zip
          if-no-files-found: error
          retention-days: 30
