name: Build Omega Horizon V9.6.8 for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build and test V9.6.8 Stage 3 Magma Cathedral Windows EXE
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out V9.6.8 source
        uses: actions/checkout@v4
      - name: Set up 64-bit Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements-build.txt
      - name: Verify V9.6.8 release identity
        shell: pwsh
        run: python verify_release.py
      - name: Source regression test - Stage 3 Magma Cathedral and protected prior-stage baselines
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python runtime_smoke_test.py
      - name: Syntax-check source
        shell: pwsh
        run: python -m py_compile omega_horizon_shmup.py runtime_smoke_test.py verify_release.py
      - name: Build V9.6.8 OmegaHorizon.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean OmegaHorizon.spec
          if (-not (Test-Path "dist\OmegaHorizon.exe")) { throw "PyInstaller did not create dist\OmegaHorizon.exe" }
      - name: Smoke-test the PACKAGED V9.6.8 EXE
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          LOCALAPPDATA: ${{ runner.temp }}\OmegaHorizonV968
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $p=Start-Process -FilePath "$PWD\dist\OmegaHorizon.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged V9.6.8 smoke test failed: $($p.ExitCode)" }
          Write-Host "PACKAGED_V968_EXE_SMOKE_TEST_OK"
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash=(Get-FileHash "dist\OmegaHorizon.exe" -Algorithm SHA256).Hash
          Set-Content -Path "dist\OmegaHorizon_V968_SHA256.txt" -Value $hash -Encoding ASCII
      - name: Create V9.6.8 release ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist\OmegaHorizon.exe","dist\OmegaHorizon_V968_SHA256.txt" -DestinationPath "dist\OmegaHorizon_V968_Windows_x64.zip" -Force
      - name: Upload tested V9.6.8 Windows build
        uses: actions/upload-artifact@v4
        with:
          name: OmegaHorizon-Windows-x64-V9.6.8-STAGE3-MAGMA-CATHEDRAL
          path: |
            dist/OmegaHorizon.exe
            dist/OmegaHorizon_V968_SHA256.txt
            dist/OmegaHorizon_V968_Windows_x64.zip
          if-no-files-found: error
          retention-days: 30
